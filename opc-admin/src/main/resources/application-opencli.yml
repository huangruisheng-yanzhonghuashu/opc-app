# OpenCLI 命令行工具配置
opencli:
  # opencli 可执行文件的绝对路径（Mac/Linux 必需）
  # 通过 `which opencli` 命令获取实际路径
  # 例如: /Users/sevilinma/.nvm/versions/node/v22.22.0/bin/opencli
  executablePath: /Users/sevilinma/.nvm/versions/node/v22.22.0/bin/opencli

  # yt-dlp 可执行文件的绝对路径
  # Windows: 不需要配置，自动使用 PATH 中的 yt-dlp
  # Mac/Linux: 配置绝对路径，如 /opt/homebrew/bin/yt-dlp
  ytDlpPath: /opt/homebrew/bin/yt-dlp

  # 命令行代理配置（用于 opencli、yt-dlp 等命令行工具）
  commandProxy:
    # 是否启用代理
    enabled: false
    # 代理主机地址
    host: 127.0.0.1
    # 代理端口
    port: 1082
    # 代理协议 (http, https, socks5)
    protocol: http
    # 代理完整地址（如果配置此项，则优先使用，忽略 host/port/protocol）
    url: http://127.0.0.1:1082


  # HTTP 代理配置（用于 HTTP 下载、API 请求等）
  httpProxy:
    # 是否启用代理
    enabled: true
    # 代理主机地址
    host: 127.0.0.1
    # 代理端口
    port: 1082
    # 代理协议 (http, https, socks5)
    protocol: http
    # 代理完整地址（如果配置此项，则优先使用，忽略 host/port/protocol）
    url: http://127.0.0.1:1082



