# Spring AI xAI (Grok) 配置
spring:
  ai:
    xai:
      # xAI API Key (建议通过环境变量传入)
      # api-key: xai-Mu1EVXMbfeiEPToexIUcnaoaIlvpm4xmwc8apW2FuZbBiYAB14UFUA0Gya30jG6bzqCQVF5xmJorsPJR
      api-key: test
      # xAI API 基础地址 (不要带 /v1 后缀，Spring AI 会自动添加)
      base-url: https://api.x.ai
      # 默认模型
      model: grok-4.20-non-reasoning
      # 温度参数 (0.0-1.0，越高越创意)
      temperature: 0.7
    minimax:
      # Minimax API Key (必填)
      # api-key: sk-api-TWPBVEDtyvfFqjCk2Vn5K74CJM6KBWxCdPpVOup6GwI89fgS6snAKg5XkCtRxlpB9DRB-j4SXpxWK3Amh7MvHi3aWfMAHUBCQ-TCaJE4rmXtqKnmFW1Oskc
      api-key: test
      # Minimax API 基础 URL (可选，默认: https://api.minimax.chat)
      base-url: https://api.minimax.chat
      # 模型名称 (可选，默认: MiniMax-Text-01)
      # 可选模型:
      # - MiniMax-Text-01 (最新文本模型)
      # - abab6.5s-chat
      # - abab6-chat
      model: MiniMax-Text-01
      # 温度参数，控制生成文本的随机性 (可选，默认: 0.7)
      # 范围: 0.0 - 1.0，值越大随机性越高
      temperature: 0.7

